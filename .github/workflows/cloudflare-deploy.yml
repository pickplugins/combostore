# Build ComboStore for Cloudflare Workers (@opennextjs/cloudflare) and deploy it.
#
# Runs on Linux with Node 22, which wrangler needs and OpenNext prefers to Windows.
# It only runs when started by hand (Actions > Deploy to Cloudflare > Run workflow).
# To deploy on every push to master, uncomment the `push` trigger below.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions):
#
#   Secrets
#     CLOUDFLARE_API_TOKEN    Cloudflare API token with "Edit Cloudflare Workers"
#                             plus "Workers R2 Storage: Edit" permissions
#     CLOUDFLARE_ACCOUNT_ID   your Cloudflare account id
#     API_TOKEN               the WordPress X-API-KEY token (the new, rotated one)
#
#   Variables (built into the code, so they must be set before the build)
#     NEXT_PUBLIC_SERVER_URL  e.g. https://server.kidobazar.com/
#     NEXT_PUBLIC_APP_URL     the live site address, e.g. https://kidobazar.com/
#     NEXT_PUBLIC_STORE_URL   the live site address, e.g. https://kidobazar.com/
#
# NEXT_PUBLIC_APP_VERSION and NEXT_PUBLIC_APP_BETA come from the committed .env.
# .env.local is not in the repo, so localhost addresses never reach this build.

name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and report the Worker size only, without deploying"
        type: boolean
        default: false
  # push:
  #   branches: [master]

# One deploy at a time; a newer run waits for the running one to finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Some pages fetch store settings while building, which needs the token.
      API_TOKEN: ${{ secrets.API_TOKEN }}
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STORE_URL: ${{ vars.NEXT_PUBLIC_STORE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check required settings
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID API_TOKEN NEXT_PUBLIC_SERVER_URL NEXT_PUBLIC_APP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets/variables:$missing"
            exit 1
          fi
          case "$NEXT_PUBLIC_SERVER_URL$NEXT_PUBLIC_APP_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::NEXT_PUBLIC_SERVER_URL / NEXT_PUBLIC_APP_URL point at localhost"
              exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npm run cf:build

      - name: Report Worker size
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Create the cache bucket if it does not exist
        if: ${{ !inputs.dry_run }}
        run: |
          bucket=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/\/\*[\s\S]*?\*\//g,'').replace(/^\s*\/\/.*$/gm,'');console.log(JSON.parse(s).r2_buckets[0].bucket_name)")
          if npx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
            echo "R2 bucket $bucket exists"
          else
            npx wrangler r2 bucket create "$bucket"
          fi

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: npx --no-install opennextjs-cloudflare deploy
        env:
          COMBOSTORE_TARGET: cloudflare

      - name: Set the Worker's API_TOKEN secret
        if: ${{ !inputs.dry_run }}
        run: printf '%s' "$API_TOKEN" | npx wrangler secret put API_TOKEN
