<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 160" width="160" height="160">
  <!-- Tile for templates/Aanchal.js: an alpona lattice (eight-petal lotus rosettes with dotted rings), in marigold at low opacity so it sits on the maroon and red bands and the cream page heads. Repeats seamlessly. -->
  <defs>
    <g id="lotus">
      <circle r="6"/>
      <circle r="22" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="2"/>
      <g id="petal"><path d="M0-8C6-14 6-26 0-34C-6-26-6-14 0-8Z"/></g>
      <use href="#petal" xlink:href="#petal" transform="rotate(45)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(90)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(135)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(180)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(225)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(270)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(315)"/>
      <circle r="40"/>
    </g>
    <g id="dot4"><circle r="2.2"/></g>
  </defs>
  <g fill="none" stroke="#F2B93B" stroke-opacity="0.3" stroke-width="1.2">
    <use href="#lotus" xlink:href="#lotus" transform="translate(80 80)"/>
    <use href="#lotus" xlink:href="#lotus" transform="translate(0 0)"/>
    <use href="#lotus" xlink:href="#lotus" transform="translate(160 0)"/>
    <use href="#lotus" xlink:href="#lotus" transform="translate(0 160)"/>
    <use href="#lotus" xlink:href="#lotus" transform="translate(160 160)"/>
  </g>
  <g fill="#F2B93B" fill-opacity="0.3">
    <circle cx="80" cy="0" r="2.5"/><circle cx="80" cy="160" r="2.5"/><circle cx="0" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/>
    <circle cx="80" cy="12" r="1.5"/><circle cx="80" cy="148" r="1.5"/><circle cx="12" cy="80" r="1.5"/><circle cx="148" cy="80" r="1.5"/>
  </g>
</svg>
