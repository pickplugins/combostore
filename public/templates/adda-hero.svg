<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" role="img" aria-label="A kraft bag of Adda house blend coffee beside a takeaway cup with a tomato-red sleeve and scattered coffee beans">
