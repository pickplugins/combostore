<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Adda Coffee template preview">
  <title>Adda Coffee template preview</title>
  <!-- Picker thumbnail for templates/Adda: a wireframe of its home page - tomato awning promo, grooved espresso letterboard header with numbered menu slots and a zigzag edge, the sticker hero with the bag and cup, and the roast scale - in the template's palette. -->
  <defs>
    <clipPath id="ad-t-clip"><rect width="800" height="600"/></clipPath>
    <pattern id="ad-t-groove" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#2A1810"/><rect width="8" height="1.2" fill="#FFFFFF" opacity="0.06"/></pattern>
    <pattern id="ad-t-zig" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H12L6 6Z" fill="#2A1810"/></pattern>
    <pattern id="ad-t-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#2A1810" opacity="0.15"/></pattern>
    <linearGradient id="ad-t-roast" x1="0" x2="1"><stop offset="0" stop-color="#C98B4E"/><stop offset="0.25" stop-color="#A86B37"/><stop offset="0.5" stop-color="#8A5228"/><stop offset="0.75" stop-color="#5E3519"/><stop offset="1" stop-color="#3A1F10"/></linearGradient>
  </defs>
