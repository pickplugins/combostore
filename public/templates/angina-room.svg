<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A sunlit living room: a terracotta sofa under two framed prints, a monstera by an arched window, a brass floor lamp, a round coffee table on a cream rug">
