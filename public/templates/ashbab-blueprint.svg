<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-label="A three-seat sofa drawn as a blueprint, front and side views, marked width 210 cm, height 84 cm and depth 95 cm">
  <!-- Hero art for templates/Ashbab: a three-seat sofa in white line art, front and side elevations, with mustard dimension lines, on a transparent background (it sits on the navy grid of the hero). -->
  <g font-family="'Red Hat Mono','Courier New',monospace" font-size="12" letter-spacing="1.5">
    <text x="40" y="100" fill="#FFFFFF" fill-opacity="0.55">FRONT ELEVATION</text>
    <text x="490" y="100" fill="#FFFFFF" fill-opacity="0.55">SIDE</text>
  </g>
  <!-- floor line -->
  <path d="M24 288H690" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- front view -->
  <g fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
    <rect x="58" y="276" width="12" height="12"/><rect x="430" y="276" width="12" height="12"/>
    <rect x="40" y="236" width="420" height="40" rx="6"/>
    <rect x="84" y="122" width="108" height="92" rx="14"/><rect x="196" y="122" width="108" height="92" rx="14"/><rect x="308" y="122" width="108" height="92" rx="14"/>
    <rect x="80" y="208" width="114" height="30" rx="7"/><rect x="194" y="208" width="112" height="30" rx="7"/><rect x="306" y="208" width="114" height="30" rx="7"/>
    <rect x="40" y="166" width="42" height="110" rx="12"/><rect x="418" y="166" width="42" height="110" rx="12"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"><path d="M138 150V186M250 150V186M362 150V186"/></g>
  <!-- side view -->
  <g fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
    <rect x="498" y="276" width="12" height="12"/><rect x="660" y="276" width="12" height="12"/>
    <rect x="490" y="236" width="190" height="40" rx="6"/>
    <path d="M492 236V136Q492 122 506 124L528 128Q540 130 540 142V212H534"/>
    <rect x="534" y="208" width="146" height="30" rx="7"/>
  </g>
  <rect x="534" y="166" width="146" height="70" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- extension lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4">
    <path d="M40 292V330M460 292V330M490 292V330M680 292V330M36 122H10M36 288H10"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#E8B931" stroke-width="2">
    <path d="M40 322H460M40 314V330M460 314V330"/>
    <path d="M490 322H680M490 314V330M680 314V330"/>
    <path d="M16 122V288M8 122H24M8 288H24"/>
  </g>
  <g fill="#E8B931"><path d="M40 322L52 317V327Z"/><path d="M460 322L448 317V327Z"/><path d="M490 322L502 317V327Z"/><path d="M680 322L668 317V327Z"/><path d="M16 122L11 134H21Z"/><path d="M16 288L11 276H21Z"/></g>
  <g font-family="'Red Hat Mono','Courier New',monospace" font-size="15" font-weight="700" fill="#E8B931" letter-spacing="1" text-anchor="middle">
    <rect x="206" y="336" width="88" height="24" rx="4" fill="#1B2B4B"/><text x="250" y="353">W 210 cm</text>
    <rect x="543" y="336" width="84" height="24" rx="4" fill="#1B2B4B"/><text x="585" y="353">D 95 cm</text>
    <g transform="translate(16 205) rotate(-90)"><rect x="-40" y="-12" width="80" height="24" rx="4" fill="#1B2B4B"/><text x="0" y="5">H 84 cm</text></g>
  </g>
</svg>
