  <rect x="32" y="512" width="240" height="80" rx="16" fill="#281B33"/>
  <rect x="284" y="512" width="484" height="80" rx="16" fill="#1C1224"/>
  <rect x="52" y="470" width="180" height="10" rx="3" fill="#FDFCFE"/>
