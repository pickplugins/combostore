  <rect x="168" y="41" width="56" height="5" rx="2.5" fill="#FDFCFE" opacity="0.6"/>
  <rect x="320" y="33" width="160" height="12" rx="3" fill="url(#ag-gold)"/>
  <rect x="352" y="51" width="96" height="3" rx="1.5" fill="#E6C594" opacity="0.7"/>
  <rect x="560" y="35" width="120" height="18" rx="9" fill="#281B33" stroke="#E6C594" stroke-opacity="0.35"/>
  <rect x="692" y="33" width="22" height="22" rx="6" fill="#281B33" stroke="#E6C594" stroke-opacity="0.35"/>
  <circle cx="714" cy="33" r="5" fill="#E6C594"/>

  <!-- hero -->
  <rect y="70" width="800" height="250" fill="#120B19"/>
  <rect x="300" y="88" width="468" height="214" rx="18" fill="#281B33" stroke="#E6C594" stroke-opacity="0.3"/>
  <circle cx="500" cy="180" r="56" fill="none" stroke="url(#ag-gold)" stroke-width="10"/>
  <path d="M482 118 l18 -22 l18 22 l-18 16 z" fill="#EED9B6"/>
  <circle cx="420" cy="160" r="9" fill="#E6C594"/>
  <circle cx="620" cy="250" r="9" fill="#E6C594"/>
  <rect x="32" y="104" width="300" height="182" rx="18" fill="#1C1224" stroke="#E6C594" stroke-opacity="0.35"/>
