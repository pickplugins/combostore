<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Aura &amp; Gem template preview">
  <title>Aura &amp; Gem template preview</title>

  <!--
    Picker thumbnail for templates/AuraGem.js: a wireframe of the template's
    own layout in its palette - plum #120B19 / #1C1224 / #281B33, gold
    #E6C594 / #C79F63 / #EED9B6, lavender #F7F4F9.
  -->

  <defs>
    <linearGradient id="ag-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF4EB"/>
      <stop offset="0.5" stop-color="#E6C594"/>
      <stop offset="1" stop-color="#C79F63"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#F7F4F9"/>

  <!-- ticker -->
  <rect width="800" height="18" fill="#120B19"/>
  <rect x="32" y="7" width="210" height="4" rx="2" fill="#E6C594" opacity="0.8"/>
  <rect x="690" y="7" width="78" height="4" rx="2" fill="#FDFCFE" opacity="0.5"/>

  <!-- header -->
  <rect y="18" width="800" height="52" fill="#1C1224"/>
  <rect x="32" y="41" width="56" height="5" rx="2.5" fill="#FDFCFE" opacity="0.6"/>
