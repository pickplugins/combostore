  <rect x="56" y="174" width="170" height="16" rx="3" fill="url(#ag-gold)"/>
  <rect x="56" y="202" width="240" height="5" rx="2.5" fill="#FDFCFE" opacity="0.4"/>
  <rect x="56" y="214" width="200" height="5" rx="2.5" fill="#FDFCFE" opacity="0.4"/>
  <rect x="56" y="238" width="104" height="26" rx="7" fill="#E6C594"/>
  <rect x="170" y="238" width="96" height="26" rx="7" fill="#281B33" stroke="#E6C594" stroke-opacity="0.4"/>

