<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="A diamond solitaire ring, a pearl drop pendant and gold hoops on a blush pedestal">
  <!-- Hero illustration for templates/Aurelle.js: a jewellery still life on blush - a pearl-drop pendant on a fine chain, a solitaire ring on a pedestal, a pair of gold hoops and sparkles. -->
  <defs>
    <linearGradient id="au-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8EEEB"/><stop offset="1" stop-color="#EBCFCB"/>
    </linearGradient>
    <linearGradient id="au-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DDAE"/><stop offset="0.5" stop-color="#C9A05E"/><stop offset="1" stop-color="#9C7638"/>
    </linearGradient>
    <linearGradient id="au-ped" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3BDB8"/><stop offset="0.5" stop-color="#F6E3E0"/><stop offset="1" stop-color="#DDB2AC"/>
    </linearGradient>
    <radialGradient id="au-pearl" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F1E6E2"/><stop offset="1" stop-color="#CDBAB4"/>
    </radialGradient>
    <linearGradient id="au-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E7EEF5"/><stop offset="1" stop-color="#B9C6D3"/>
    </linearGradient>
    <radialGradient id="au-glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="au-spark" d="M0-10C1.5-2 2-1.5 10 0C2 1.5 1.5 2 0 10C-1.5 2-2 1.5-10 0C-2-1.5-1.5-2 0-10Z"/>
  </defs>
  <rect width="400" height="520" fill="url(#au-bg)"/>
  <ellipse cx="200" cy="190" rx="220" ry="200" fill="url(#au-glow)"/>
  <!-- pendant on a fine chain -->
  <path d="M60 0C90 150 150 210 200 214C250 210 310 150 340 0" fill="none" stroke="url(#au-gold)" stroke-width="2"/>
  <path d="M60 0C90 150 150 210 200 214C250 210 310 150 340 0" fill="none" stroke="#FFF6E0" stroke-width="0.6" stroke-dasharray="1 3" opacity="0.8"/>
  <circle cx="200" cy="218" r="5" fill="none" stroke="url(#au-gold)" stroke-width="2"/>
  <path d="M193 226h14l-3 8h-8z" fill="url(#au-gold)"/>
  <ellipse cx="200" cy="254" rx="17" ry="21" fill="url(#au-pearl)"/>
  <ellipse cx="194" cy="246" rx="5" ry="7" fill="#FFFFFF" opacity="0.8"/>
  <!-- pedestal -->
  <path d="M110 520V418a90 26 0 0 1 180 0V520z" fill="url(#au-ped)"/>
  <ellipse cx="200" cy="418" rx="90" ry="26" fill="#F8E9E6"/>
  <ellipse cx="200" cy="418" rx="90" ry="26" fill="none" stroke="#C9A05E" stroke-opacity="0.5"/>
  <!-- solitaire ring -->
  <ellipse cx="200" cy="384" rx="34" ry="30" fill="none" stroke="url(#au-gold)" stroke-width="7"/>
  <ellipse cx="200" cy="384" rx="34" ry="30" fill="none" stroke="#FFF3D6" stroke-width="1.2" opacity="0.7"/>
  <path d="M190 356l-4-8h28l-4 8z" fill="url(#au-gold)"/>
  <path d="M184 348l-8-12 10-12h28l10 12-8 12z" fill="url(#au-gem)" stroke="#A9B6C4" stroke-width="0.8"/>
  <path d="M176 336h48M186 324l-4 12 18 12 18-12-4-12M200 324v24" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.9"/>
  <!-- hoops on the side -->
  <g fill="none" stroke="url(#au-gold)" stroke-width="6">
    <circle cx="74" cy="452" r="24"/><circle cx="326" cy="452" r="24"/>
  </g>
  <g fill="none" stroke="#FFF3D6" stroke-width="1" opacity="0.7"><circle cx="74" cy="452" r="24"/><circle cx="326" cy="452" r="24"/></g>
  <!-- loose pearls -->
  <circle cx="132" cy="500" r="7" fill="url(#au-pearl)"/><circle cx="150" cy="505" r="5" fill="url(#au-pearl)"/>
  <circle cx="268" cy="502" r="6" fill="url(#au-pearl)"/>
  <!-- sparkles -->
  <g fill="#FFFFFF">
    <use href="#au-spark" transform="translate(232 322) scale(0.9)"/>
    <use href="#au-spark" transform="translate(166 340) scale(0.5)"/>
    <use href="#au-spark" transform="translate(222 240) scale(0.6)"/>
  </g>
  <g fill="#C9A05E" opacity="0.7">
    <use href="#au-spark" transform="translate(84 110) scale(0.7)"/>
    <use href="#au-spark" transform="translate(320 90) scale(0.9)"/>
    <use href="#au-spark" transform="translate(340 300) scale(0.6)"/>
    <use href="#au-spark" transform="translate(60 300) scale(0.5)"/>
  </g>
</svg>
