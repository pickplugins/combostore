<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Dolna Baby Essentials template preview">
  <title>Dolna Baby Essentials template preview</title>
  <!-- Picker thumbnail for templates/Dolna: a wireframe of its home page - the blue promo line, the white header with the cloud logo, menu and peach cart, the scallops under it, the hero copy and the diaper size finder (packs stacked by weight, size M picked) with its two chips, and the stitched shop-by-need cards - in the template's palette. -->
  <defs>
