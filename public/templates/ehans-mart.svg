<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ehans Mart template preview">
  <title>Ehans Mart template preview</title>

  <!--
    Picker thumbnail for templates/EhansMart.js. An original wireframe drawing
    of this template's own layout, carrying no logos or artwork from anywhere
    else, using only the template's tokens: brand #ff5554, card accent #ff5454,
    ink #211913, page #fcf7f5, hairline #e8e3e1, field border #988f8d,
    muted #6c6c6c, tile #f5f5f5, blush #fff8f7 -> #fde9e8.
  -->

  <defs>
