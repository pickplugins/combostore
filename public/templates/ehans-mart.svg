      <stop offset="0" stop-color="#fff8f7"/>
      <stop offset="1" stop-color="#fde9e8"/>
    </linearGradient>
    <linearGradient id="em-scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211913" stop-opacity="0"/>
      <stop offset="1" stop-color="#211913" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#fcf7f5"/>

