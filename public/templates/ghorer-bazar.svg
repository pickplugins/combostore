<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ghorer Bazar template preview">
  <title>Ghorer Bazar template preview</title>

  <!--
    Picker thumbnail for templates/GhorerBazar.js. An original wireframe drawing
    of this template's own layout, carrying no logos or artwork from anywhere
    else, using only the template's tokens: primary #f48721, secondary #041f1e,
    title #222831, body #252a34, hairline #e4e7ec, off-white #f5f5f5,
    sale #ff1818, stars #f8b400.
  -->

  <rect width="800" height="600" fill="#ffffff"/>

