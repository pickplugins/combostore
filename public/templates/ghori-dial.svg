<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="A steel automatic watch with a midnight-blue sunburst dial, champagne indices and a black leather strap">
  <!-- Hero art for templates/Ghori: the watch WITHOUT hands. The hands are CSS blocks laid over it (the seconds hand ticks), pivoting at the exact centre (300,300), so keep the dial centred if you swap this file. -->
  <defs>
    <radialGradient id="gh-dial" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#26406B"/><stop offset="0.55" stop-color="#13213A"/><stop offset="1" stop-color="#0B1220"/></radialGradient>
    <linearGradient id="gh-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F2F4"/><stop offset="0.45" stop-color="#B9BFC9"/><stop offset="1" stop-color="#6E7685"/></linearGradient>
    <linearGradient id="gh-strap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151515"/><stop offset="0.5" stop-color="#2A2622"/><stop offset="1" stop-color="#151515"/></linearGradient>
    <linearGradient id="gh-champ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAD7AE"/><stop offset="1" stop-color="#B18F55"/></linearGradient>
  </defs>
  <!-- strap -->
  <rect x="214" y="-10" width="172" height="130" fill="url(#gh-strap)"/>
  <rect x="214" y="480" width="172" height="130" fill="url(#gh-strap)"/>
  <g stroke="#C9A96E" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"><path d="M226 0v108M374 0v108M226 492v108M374 492v108"/></g>
  <!-- lugs -->
  <g fill="url(#gh-steel)" stroke="#5E6676" stroke-width="1.5">
    <path d="M196 132l18-58h44l-6 58z"/><path d="M404 132l-18-58h-44l6 58z"/>
    <path d="M196 468l18 58h44l-6-58z"/><path d="M404 468l-18 58h-44l6-58z"/>
  </g>
  <!-- crown -->
  <rect x="520" y="276" width="30" height="48" rx="6" fill="url(#gh-steel)" stroke="#5E6676" stroke-width="1.5"/>
  <g stroke="#5E6676" stroke-width="1.5"><path d="M526 280v40M532 280v40M538 280v40M544 280v40"/></g>
  <!-- case + bezel -->
  <circle cx="300" cy="300" r="232" fill="url(#gh-steel)" stroke="#5E6676" stroke-width="2"/>
  <circle cx="300" cy="300" r="216" fill="#0B1220"/>
  <circle cx="300" cy="300" r="205" fill="none" stroke="#C9A96E" stroke-width="10" stroke-dasharray="1.6 19.87" transform="rotate(-90.2 300 300)" opacity="0.8"/>
  <circle cx="300" cy="300" r="196" fill="none" stroke="url(#gh-steel)" stroke-width="3"/>
  <!-- dial -->
  <circle cx="300" cy="300" r="192" fill="url(#gh-dial)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2">
    <path d="M300 108v384M108 300h384M164 164l272 272M436 164L164 436M226 122l148 356M374 122L226 478M122 226l356 148M122 374l356-148"/>
  </g>
  <circle cx="300" cy="300" r="178" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="1 17.64" transform="rotate(-90.2 300 300)"/>
  <!-- hour indices: champagne batons with lume -->
  <g fill="url(#gh-champ)">
    <g id="gh-idx"><rect x="293" y="126" width="14" height="44" rx="2"/><rect x="297" y="131" width="6" height="34" rx="1" fill="#9BF2C4"/></g>
    <use href="#gh-idx" transform="rotate(30 300 300)"/><use href="#gh-idx" transform="rotate(60 300 300)"/>
    <use href="#gh-idx" transform="rotate(120 300 300)"/><use href="#gh-idx" transform="rotate(150 300 300)"/><use href="#gh-idx" transform="rotate(180 300 300)"/>
    <use href="#gh-idx" transform="rotate(210 300 300)"/><use href="#gh-idx" transform="rotate(240 300 300)"/><use href="#gh-idx" transform="rotate(270 300 300)"/>
    <use href="#gh-idx" transform="rotate(300 300 300)"/><use href="#gh-idx" transform="rotate(330 300 300)"/>
  </g>
  <!-- 12 o'clock: double baton -->
  <g fill="url(#gh-champ)"><rect x="281" y="126" width="12" height="48" rx="2"/><rect x="307" y="126" width="12" height="48" rx="2"/></g>
  <g fill="#9BF2C4"><rect x="284.5" y="131" width="5" height="38" rx="1"/><rect x="310.5" y="131" width="5" height="38" rx="1"/></g>
  <!-- date window at 3 -->
  <rect x="402" y="286" width="38" height="28" rx="3" fill="#F5F4F0" stroke="url(#gh-champ)" stroke-width="3"/>
  <text x="421" y="307" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0B1220" text-anchor="middle">26</text>
  <!-- dial text -->
  <text x="300" y="222" font-family="Prata, Georgia, serif" font-size="26" letter-spacing="6" fill="#E2CC9B" text-anchor="middle">GHORI</text>
  <text x="300" y="242" font-family="Michroma, Arial, sans-serif" font-size="8" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">DHAKA</text>
  <text x="300" y="392" font-family="Michroma, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#E2CC9B" text-anchor="middle">AUTOMATIC</text>
  <text x="300" y="410" font-family="Michroma, Arial, sans-serif" font-size="7" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle">100 M · 330 FT</text>
  <!-- crystal glare -->
  <path d="M170 190a170 170 0 0 1 150-80 190 190 0 0 0-150 80z" fill="#FFFFFF" opacity="0.07"/>
</svg>
