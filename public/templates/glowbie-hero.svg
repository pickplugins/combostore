<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="A serum dropper bottle, a cherry lipstick, a peach cream jar and a compact on a lilac backdrop">
  <!-- Hero illustration for templates/Glowbie.js: a flat, outlined product still life - serum dropper, lipstick, cream jar, compact - with sparkles and soft shapes, in the template's ink-outline style. -->
  <defs>
    <linearGradient id="gb-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B79CF2"/><stop offset="0.5" stop-color="#D9CBFA"/><stop offset="1" stop-color="#9F7FE8"/>
    </linearGradient>
    <linearGradient id="gb-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6C36A"/><stop offset="0.5" stop-color="#FBE6A6"/><stop offset="1" stop-color="#C9A04A"/>
    </linearGradient>
    <path id="gb-spark" d="M0-14C2-3 3-2 14 0C3 2 2 3 0 14C-2 3-3 2-14 0C-3-2-2-3 0-14Z"/>
  </defs>
  <rect width="480" height="480" fill="#EDE4FF"/>
  <circle cx="380" cy="110" r="80" fill="#FFD9C7"/>
  <circle cx="90" cy="380" r="70" fill="#D9F5E8"/>
  <path d="M40 120c30-40 90-40 110 0" fill="none" stroke="#1B1320" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- shelf -->
  <rect x="40" y="380" width="400" height="18" rx="9" fill="#FFFFFF" stroke="#1B1320" stroke-width="3"/>
  <g stroke="#1B1320" stroke-width="3" stroke-linejoin="round">
    <!-- serum dropper -->
    <rect x="96" y="200" width="88" height="180" rx="18" fill="url(#gb-glass)"/>
    <rect x="112" y="176" width="56" height="26" rx="6" fill="#1B1320"/>
    <path d="M124 176v-34c0-14 32-14 32 0v34" fill="#E0245E"/>
    <rect x="112" y="250" width="56" height="70" rx="8" fill="#FFFFFF"/>
    <!-- lipstick -->
    <rect x="216" y="290" width="54" height="90" rx="8" fill="url(#gb-gold)"/>
    <rect x="222" y="244" width="42" height="48" rx="4" fill="#1B1320"/>
    <path d="M226 244v-46l34-22v68z" fill="#E0245E"/>
    <!-- cream jar -->
    <rect x="296" y="300" width="128" height="80" rx="16" fill="#FFD9C7"/>
    <rect x="290" y="272" width="140" height="34" rx="12" fill="#FFFFFF"/>
    <rect x="320" y="326" width="80" height="30" rx="6" fill="#FFFFFF"/>
    <!-- compact -->
    <ellipse cx="380" cy="246" rx="44" ry="14" fill="#D4F25A"/>
    <path d="M336 246c0-42 88-42 88 0" fill="#FFFFFF"/>
    <circle cx="380" cy="226" r="14" fill="#FFE4EC"/>
  </g>
  <g fill="#1B1320" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="140" y="280" font-size="13">SERUM</text>
    <text x="140" y="298" font-size="11">10%</text>
    <text x="360" y="346" font-size="12">GLOW</text>
  </g>
  <g fill="#FFFFFF" stroke="#1B1320" stroke-width="2.5" stroke-linejoin="round">
    <use href="#gb-spark" transform="translate(210 120)"/>
    <use href="#gb-spark" transform="translate(300 180) scale(0.7)"/>
  </g>
  <g fill="#D4F25A" stroke="#1B1320" stroke-width="2.5" stroke-linejoin="round">
    <use href="#gb-spark" transform="translate(70 230) scale(0.8)"/>
    <use href="#gb-spark" transform="translate(440 300) scale(0.6)"/>
  </g>
</svg>
