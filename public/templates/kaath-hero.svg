  <path d="M700 400V250c0-90-50-120-70-122" fill="none" stroke="#C9A24B" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="700" cy="404" rx="30" ry="8" fill="#2B2420"/>
  <path d="M606 170c0-30 48-30 48 0z" fill="#2B2420"/>
  <ellipse cx="630" cy="200" rx="60" ry="22" fill="#FFF3D6" opacity="0.5"/>
  <!-- armchair corner -->
  <rect x="660" y="300" width="120" height="70" rx="24" fill="#8FA68A"/>
  <rect x="676" y="270" width="104" height="60" rx="22" fill="#7E9479"/>
</svg>
