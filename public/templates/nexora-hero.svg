<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" fill="none" role="img" aria-label="Analytics dashboard with deployment and performance charts">
  <!-- The Nexora Tech template's hero illustration: a product dashboard mockup. -->
  <defs>
