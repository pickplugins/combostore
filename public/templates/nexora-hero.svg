  <rect x="18" y="58" width="26" height="26" rx="7" fill="url(#nx-mark)"/>
  <rect x="52" y="66" width="48" height="10" rx="5" fill="#2A3557"/>
  <rect x="14" y="108" width="92" height="26" rx="8" fill="#1E2A52"/>
  <rect x="26" y="117" width="10" height="8" rx="2" fill="#818CF8"/><rect x="44" y="117" width="48" height="8" rx="4" fill="#A5B4FC"/>
  <rect x="26" y="155" width="10" height="8" rx="2" fill="#334066"/><rect x="44" y="155" width="44" height="8" rx="4" fill="#334066"/>
