    <rect x="156" y="76" width="54" height="8" rx="4" fill="#475477"/>
    <rect x="156" y="94" width="82" height="16" rx="5" fill="#E0E7FF"/>
    <rect x="156" y="118" width="40" height="8" rx="4" fill="#34D399"/>
