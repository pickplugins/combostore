<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A foggy winter dawn over fields, with a date palm tree whose trunk is tapped into a clay pot">
  <!-- Hero backdrop for templates/Nolen: a winter dawn in rural Bengal - date palms with a clay hari (sap pot) tied under the crown, fog over the fields. The left side is kept quiet for the headline; the page lays a fog gradient over it. -->
  <defs>
    <linearGradient id="nl-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFC0C8"/><stop offset="0.5" stop-color="#D9D6CC"/><stop offset="0.72" stop-color="#F3D2A6"/><stop offset="1" stop-color="#E9B97E"/></linearGradient>
    <radialGradient id="nl-sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE6B0"/><stop offset="0.45" stop-color="#F7C873"/><stop offset="1" stop-color="#F7C873" stop-opacity="0"/></radialGradient>
    <linearGradient id="nl-field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C9473"/><stop offset="1" stop-color="#3F4A33"/></linearGradient>
    <linearGradient id="nl-trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A3A24"/><stop offset="0.5" stop-color="#7A5233"/><stop offset="1" stop-color="#4A2C1A"/></linearGradient>
    <linearGradient id="nl-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D07A4A"/><stop offset="1" stop-color="#8E3E1E"/></linearGradient>
    <pattern id="nl-bark" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="none" stroke="#3B2416" stroke-opacity="0.45" stroke-width="2"/></pattern>
    <filter id="nl-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="nl-blur-s" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1440" height="760" fill="url(#nl-sky)"/>
  <!-- sun -->
  <circle cx="1010" cy="500" r="190" fill="url(#nl-sun)"/>
  <circle cx="1010" cy="500" r="58" fill="#FFE2A6"/>
  <!-- far tree line -->
  <path d="M0 520Q80 500 160 512T320 506T480 514T640 502T800 512T960 500T1120 510T1280 498T1440 508V560H0Z" fill="#8E9C95" opacity="0.6"/>
  <!-- distant palms -->
  <g fill="none" stroke="#7E8C86" stroke-linecap="round" opacity="0.7">
    <path d="M1300 520C1296 470 1300 420 1308 380" stroke-width="7"/>
    <g stroke-width="12" stroke-dasharray="2 4" stroke-linecap="butt"><path d="M1308 380Q1270 360 1250 380"/><path d="M1308 380Q1350 356 1372 376"/><path d="M1308 380Q1300 340 1282 330"/><path d="M1308 380Q1326 340 1346 336"/></g>
    <path d="M240 520C236 480 240 440 246 410" stroke-width="6"/>
    <g stroke-width="10" stroke-dasharray="2 4" stroke-linecap="butt"><path d="M246 410Q214 394 198 410"/><path d="M246 410Q280 390 298 406"/><path d="M246 410Q240 378 226 370"/></g>
  </g>
  <!-- fields -->
  <path d="M0 540Q360 520 720 536T1440 530V760H0Z" fill="url(#nl-field)"/>
  <g stroke="#2F3826" stroke-opacity="0.15" stroke-width="1.5" fill="none"><path d="M0 600Q400 585 820 598T1440 590"/><path d="M0 650Q420 640 900 652T1440 646"/><path d="M0 700Q500 692 1000 702T1440 698"/></g>

  <!-- main date palm -->
  <path d="M1132 760C1120 640 1112 520 1124 400C1132 330 1140 280 1150 236" fill="none" stroke="url(#nl-trunk)" stroke-width="44" stroke-linecap="round"/>
  <path d="M1132 760C1120 640 1112 520 1124 400C1132 330 1140 280 1150 236" fill="none" stroke="url(#nl-bark)" stroke-width="40"/>
  <!-- fronds: thick dashed strokes read as leaflets -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#3E5B3A" stroke-width="30" stroke-dasharray="3 5" stroke-linecap="butt">
      <path d="M1150 236Q1050 180 970 240"/><path d="M1150 236Q1260 170 1340 230"/><path d="M1150 236Q1090 120 1010 110"/>
      <path d="M1150 236Q1220 110 1310 104"/><path d="M1150 236Q1150 120 1130 60"/><path d="M1150 236Q1060 240 1010 320"/><path d="M1150 236Q1250 240 1300 318"/>
    </g>
    <g stroke="#2C4229" stroke-width="5">
      <path d="M1150 236Q1050 180 970 240"/><path d="M1150 236Q1260 170 1340 230"/><path d="M1150 236Q1090 120 1010 110"/>
      <path d="M1150 236Q1220 110 1310 104"/><path d="M1150 236Q1150 120 1130 60"/><path d="M1150 236Q1060 240 1010 320"/><path d="M1150 236Q1250 240 1300 318"/>
    </g>
  </g>
  <!-- tapping cut, bamboo spout and the clay hari -->
  <path d="M1126 270L1166 262L1162 300L1124 306Z" fill="#E9C9A0"/>
  <path d="M1140 302L1104 330" stroke="#C9A86A" stroke-width="6" stroke-linecap="round"/>
  <path d="M1104 330l-2 8" stroke="#D99A45" stroke-width="3" stroke-linecap="round"/>
  <path d="M1084 300Q1100 296 1124 296" fill="none" stroke="#5A3A24" stroke-width="3"/>
  <g>
    <path d="M1072 344Q1068 330 1080 326H1124Q1136 330 1132 344Z" fill="#8E3E1E"/>
    <path d="M1070 344C1050 360 1048 410 1074 432C1090 444 1114 444 1130 432C1156 410 1154 360 1134 344Z" fill="url(#nl-clay)"/>
    <path d="M1066 380Q1102 390 1138 380" stroke="#6E2E14" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M1080 326L1078 300M1124 326L1128 298" stroke="#5A3A24" stroke-width="2.5"/>
  </g>

  <!-- second palm, left of the main one -->
  <path d="M900 760C894 680 892 600 900 520C904 480 908 450 914 420" fill="none" stroke="url(#nl-trunk)" stroke-width="30" stroke-linecap="round" opacity="0.92"/>
  <path d="M900 760C894 680 892 600 900 520C904 480 908 450 914 420" fill="none" stroke="url(#nl-bark)" stroke-width="28" opacity="0.8"/>
  <g fill="none" stroke-linecap="round" opacity="0.92">
    <g stroke="#4A6646" stroke-width="22" stroke-dasharray="3 5" stroke-linecap="butt"><path d="M914 420Q850 380 800 420"/><path d="M914 420Q980 376 1030 412"/><path d="M914 420Q880 340 830 330"/><path d="M914 420Q956 336 1004 332"/><path d="M914 420Q914 350 900 310"/></g>
    <g stroke="#2C4229" stroke-width="4"><path d="M914 420Q850 380 800 420"/><path d="M914 420Q980 376 1030 412"/><path d="M914 420Q880 340 830 330"/><path d="M914 420Q956 336 1004 332"/><path d="M914 420Q914 350 900 310"/></g>
  </g>
  <path d="M884 470C870 480 870 510 886 520C896 526 910 526 918 518C930 506 928 480 916 470Z" fill="url(#nl-clay)"/>

  <!-- fog -->
  <g fill="#F4F3EE" filter="url(#nl-blur)">
    <ellipse cx="300" cy="560" rx="520" ry="40" opacity="0.85"/>
    <ellipse cx="1000" cy="580" rx="560" ry="46" opacity="0.75"/>
    <ellipse cx="700" cy="660" rx="760" ry="38" opacity="0.55"/>
  </g>
  <g fill="#FFFFFF" filter="url(#nl-blur-s)" opacity="0.5"><ellipse cx="1180" cy="520" rx="220" ry="14"/><ellipse cx="420" cy="610" rx="260" ry="12"/></g>
</svg>
