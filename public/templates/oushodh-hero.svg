<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" role="img" aria-label="A prescription, a pill bottle, a blister pack and a stethoscope">
  <!-- Art for the prescription card in templates/Oushodh.js (sits on navy, transparent background): an Rx prescription slip, a teal pill bottle, a blister pack, loose capsules and a stethoscope. -->
  <!-- prescription slip -->
  <g transform="rotate(-6 120 110)">
    <rect x="50" y="30" width="140" height="170" rx="10" fill="#FFFFFF"/>
    <rect x="50" y="30" width="140" height="28" rx="10" fill="#E3F4F2"/>
    <rect x="50" y="48" width="140" height="10" fill="#E3F4F2"/>
    <text x="64" y="96" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0E8A7E">Rx</text>
    <g fill="#12305A" opacity="0.25"><rect x="64" y="110" width="110" height="6" rx="3"/><rect x="64" y="124" width="90" height="6" rx="3"/><rect x="64" y="138" width="100" height="6" rx="3"/><rect x="64" y="152" width="70" height="6" rx="3"/></g>
    <path d="M120 180c10-10 20 6 30-4s16 4 26-2" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- pill bottle -->
  <rect x="214" y="46" width="70" height="20" rx="5" fill="#E8553A"/>
  <rect x="210" y="64" width="78" height="128" rx="14" fill="#0E8A7E"/>
  <rect x="220" y="96" width="58" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="244" y="104" width="10" height="28" rx="2" fill="#0E8A7E"/><rect x="235" y="113" width="28" height="10" rx="2" fill="#0E8A7E"/>
  <rect x="228" y="138" width="42" height="5" rx="2.5" fill="#12305A" opacity="0.3"/>
  <!-- blister pack -->
  <g transform="rotate(10 350 120)">
    <rect x="300" y="58" width="96" height="130" rx="10" fill="#DCE6E8"/>
    <g fill="#FFFFFF" stroke="#B9C9CD" stroke-width="1.5">
      <ellipse cx="327" cy="84" rx="13" ry="9"/><ellipse cx="369" cy="84" rx="13" ry="9"/>
      <ellipse cx="327" cy="112" rx="13" ry="9"/><ellipse cx="369" cy="112" rx="13" ry="9"/>
      <ellipse cx="327" cy="140" rx="13" ry="9"/><ellipse cx="369" cy="140" rx="13" ry="9"/>
      <ellipse cx="327" cy="168" rx="13" ry="9"/>
    </g>
    <ellipse cx="369" cy="168" rx="13" ry="9" fill="#C9D6D9"/>
  </g>
  <!-- capsules -->
  <g transform="rotate(-30 206 206)"><rect x="186" y="198" width="40" height="16" rx="8" fill="#FFFFFF"/><path d="M206 198h12a8 8 0 0 1 0 16h-12z" fill="#E8553A"/></g>
  <g transform="rotate(20 300 206)"><rect x="282" y="198" width="36" height="14" rx="7" fill="#FFFFFF"/><path d="M300 198h11a7 7 0 0 1 0 14h-11z" fill="#7FD1C5"/></g>
  <!-- stethoscope -->
  <path d="M20 40c0 50 30 70 30 110s40 50 60 30" fill="none" stroke="#7FD1C5" stroke-width="5" stroke-linecap="round"/>
  <circle cx="114" cy="176" r="14" fill="#7FD1C5"/><circle cx="114" cy="176" r="7" fill="#12305A"/>
  <circle cx="20" cy="36" r="5" fill="#7FD1C5"/>
</svg>
