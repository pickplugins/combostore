    <path d="M0 52C-4 34 10 24 20 26C20 10 36 2 46 8C56 0 72 8 70 24C84 24 90 40 84 52Z" fill="#FDE6E7"/>
    <path d="M20 26C30 30 40 28 46 22M58 30C64 34 72 32 76 28" fill="none" stroke="#F7B9BE" stroke-width="4" stroke-linecap="round"/>
