<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-label="A two-tier strawberry cake on a stand beside a croissant, a loaf of bread and a cupcake">
  <!-- Hero art for templates/Pauruti: a flat, modern bakery still life - two-tier strawberry cake on a cake stand, a loaf, a croissant and a cupcake - on a transparent background (it sits on the butter banner). -->
  <defs>
    <linearGradient id="pr-loaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D99150"/><stop offset="1" stop-color="#A9622B"/></linearGradient>
    <linearGradient id="pr-crois" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8A55A"/><stop offset="1" stop-color="#B86A2C"/></linearGradient>
    <linearGradient id="pr-stand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1E6D8"/></linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="240" cy="414" rx="210" ry="16" fill="#3B2416" opacity="0.16"/>
