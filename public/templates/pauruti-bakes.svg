  <ellipse cx="240" cy="404" rx="54" ry="10" fill="#E6D4BD"/>
  <ellipse cx="240" cy="352" rx="150" ry="20" fill="#E6D4BD"/>
  <ellipse cx="240" cy="346" rx="150" ry="20" fill="url(#pr-stand)"/>
  <!-- bottom tier -->
  <path d="M120 240H360V336C360 346 300 352 240 352C180 352 120 346 120 336Z" fill="#FFF7EE"/>
  <ellipse cx="240" cy="240" rx="120" ry="18" fill="#F7B9BE"/>
  <path d="M120 240V262C128 270 136 270 140 262V250C146 274 160 276 164 256C170 266 182 266 186 254V246C194 282 210 282 214 252C222 264 234 264 238 252C246 272 262 272 266 250C274 262 286 262 290 248C296 276 312 276 316 254C324 266 334 266 338 252C344 266 356 264 360 252V240Z" fill="#F7B9BE"/>
