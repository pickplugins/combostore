  <path d="M168 214C200 222 280 222 312 214" fill="none" stroke="#CC3B47" stroke-width="4" opacity="0.5"/>
  <!-- strawberries + candle -->
  <rect x="235" y="88" width="10" height="56" rx="3" fill="#FFFFFF"/>
  <path d="M235 98L245 92M235 112L245 106M235 126L245 120M235 140L245 134" stroke="#E8505B" stroke-width="3"/>
  <path d="M240 60C250 72 252 80 240 88C228 80 230 72 240 60Z" fill="#FFC94D"/>
