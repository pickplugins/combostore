<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Sugondhi Perfumery template preview">
  <title>Sugondhi Perfumery template preview</title>
  <!-- Picker thumbnail for templates/Sugondhi: a wireframe of its home page - spectrum header and the bottle hero with floating notes - in the template's palette. -->
  <defs>
    <clipPath id="sg-t-clip"><rect width="800" height="600"/></clipPath>
    <linearGradient id="sg-t-spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E7B84A"/><stop offset="0.2" stop-color="#C8742E"/><stop offset="0.4" stop-color="#D98C8C"/><stop offset="0.6" stop-color="#CDBEE8"/><stop offset="0.8" stop-color="#A9C3A5"/><stop offset="1" stop-color="#3E2A23"/></linearGradient>
    <linearGradient id="sg-t-juice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7A64A"/><stop offset="1" stop-color="#A65B1F"/></linearGradient>
    <linearGradient id="sg-t-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7330"/><stop offset="0.4" stop-color="#F3D58C"/><stop offset="1" stop-color="#7E5A22"/></linearGradient>
    <filter id="sg-t-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#sg-t-clip)">
  <rect width="800" height="600" fill="#F7F2EC"/>
  <circle cx="90" cy="260" r="130" fill="#E7B84A" opacity="0.35" filter="url(#sg-t-blur)"/>
  <circle cx="420" cy="330" r="150" fill="#D98C8C" opacity="0.28" filter="url(#sg-t-blur)"/>
  <circle cx="740" cy="460" r="130" fill="#CDBEE8" opacity="0.55" filter="url(#sg-t-blur)"/>
  <!-- promo + header -->
  <rect width="800" height="20" fill="#2A1B17"/>
  <rect x="270" y="8" width="200" height="4" rx="2" fill="#F7F2EC" opacity="0.6"/><rect x="478" y="5" width="44" height="10" rx="5" fill="#E7B84A"/>
  <path d="M24 64V42a11 11 0 0 1 22 0v22z" fill="url(#sg-t-spec)"/>
  <text x="56" y="56" font-family="Italiana, Georgia, serif" font-size="20" letter-spacing="5" fill="#2A1B17">SUGONDHI</text>
  <rect x="610" y="38" width="120" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.7" stroke="#2A1B17" stroke-opacity="0.15"/>
  <circle cx="752" cy="49" r="11" fill="#2A1B17"/>
  <rect y="76" width="800" height="1" fill="#2A1B17" opacity="0.1"/>
  <g fill="#2A1B17" opacity="0.7"><rect x="200" y="90" width="28" height="4" rx="2"/><rect x="244" y="90" width="44" height="4" rx="2"/><rect x="304" y="90" width="44" height="4" rx="2"/><rect x="372" y="90" width="38" height="4" rx="2"/><rect x="434" y="90" width="28" height="4" rx="2"/><rect x="486" y="90" width="40" height="4" rx="2"/><rect x="550" y="90" width="50" height="4" rx="2"/></g>
  <g><circle cx="365" cy="92" r="2.5" fill="#C8742E"/><circle cx="427" cy="92" r="2.5" fill="#3E2A23"/><circle cx="479" cy="92" r="2.5" fill="#D98C8C"/><circle cx="543" cy="92" r="2.5" fill="#A9C3A5"/></g>
  <rect y="106" width="800" height="3" fill="url(#sg-t-spec)"/>
  <!-- headline around the bottle -->
  <text x="300" y="290" font-family="Italiana, Georgia, serif" font-size="64" fill="#2A1B17" text-anchor="end">Wear</text>
  <text x="300" y="350" font-family="Italiana, Georgia, serif" font-size="64" fill="#2A1B17" text-anchor="end">your</text>
  <text x="510" y="320" font-family="Italiana, Georgia, serif" font-size="64" font-style="italic" fill="#C8742E">story.</text>
  <!-- bottle -->
  <ellipse cx="405" cy="470" rx="80" ry="9" fill="#2A1B17" opacity="0.15"/>
  <rect x="380" y="146" width="50" height="50" rx="5" fill="url(#sg-t-gold)"/>
  <rect x="386" y="194" width="38" height="14" fill="url(#sg-t-gold)"/>
  <path d="M345 214H465L482 234V444Q482 462 464 462H346Q328 462 328 444V234Z" fill="url(#sg-t-juice)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M345 214H465L482 234V258H328V234Z" fill="#FFFFFF" opacity="0.2"/>
  <rect x="338" y="268" width="6" height="150" rx="3" fill="#FFFFFF" opacity="0.4"/>
  <rect x="363" y="318" width="84" height="66" rx="3" fill="#F7F2EC"/>
  <text x="405" y="358" font-family="Italiana, Georgia, serif" font-size="14" fill="#2A1B17" text-anchor="middle">Oud Noir</text>
  <!-- notes -->
  <g fill="#FFFFFF" fill-opacity="0.75" stroke="#FFFFFF"><rect x="270" y="200" width="96" height="34" rx="17"/><rect x="452" y="330" width="110" height="34" rx="17"/><rect x="282" y="410" width="104" height="34" rx="17"/></g>
  <circle cx="286" cy="217" r="4" fill="#E7B84A"/><circle cx="468" cy="347" r="4" fill="#D98C8C"/><circle cx="298" cy="427" r="4" fill="#3E2A23"/>
  <g fill="#2A1B17" opacity="0.6"><rect x="296" y="214" width="56" height="6" rx="3"/><rect x="478" y="344" width="70" height="6" rx="3"/><rect x="308" y="424" width="64" height="6" rx="3"/></g>
  <!-- buttons + marquee -->
  <rect x="300" y="500" width="100" height="30" rx="15" fill="#2A1B17"/><rect x="410" y="500" width="100" height="30" rx="15" fill="none" stroke="#2A1B17" stroke-opacity="0.3"/>
  <rect y="556" width="800" height="44" fill="#2A1B17"/>
  <g font-family="Italiana, Georgia, serif" font-size="20"><text x="20" y="585" fill="#F7F2EC">Bergamot ✦</text><text x="150" y="585" fill="#E7B84A">Damask rose ✦</text><text x="310" y="585" fill="#F7F2EC">Oud ✦</text><text x="390" y="585" fill="#E7B84A">Amber ✦</text><text x="490" y="585" fill="#F7F2EC">White musk ✦</text><text x="640" y="585" fill="#E7B84A">Sandalwood ✦</text></g>
  </g>
</svg>
