<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="A flat-lay of kids clothes: a yellow tee with a bird print, blue dungarees, a pink dress, mint sneakers, an orange cap and lilac socks">
