<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="A smartphone, wireless earbuds in their case and a smartwatch">
  <!-- Hero art for templates/Voltix.js (sits on the graphite bento card, transparent background): a smartphone with a camera island, an open earbuds case and a smartwatch. -->
  <defs>
    <linearGradient id="vx-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563FF"/><stop offset="0.6" stop-color="#6D8BFF"/><stop offset="1" stop-color="#C6FF3D"/>
    </linearGradient>
    <linearGradient id="vx-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2F36"/><stop offset="0.5" stop-color="#454C56"/><stop offset="1" stop-color="#2A2F36"/>
    </linearGradient>
    <linearGradient id="vx-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DDE3"/>
    </linearGradient>
  </defs>
  <!-- phone (back, tilted) -->
  <g transform="rotate(-12 230 170)">
    <rect x="170" y="20" width="140" height="290" rx="26" fill="url(#vx-body)" stroke="#5B6270" stroke-width="1.5"/>
    <rect x="182" y="32" width="116" height="266" rx="18" fill="url(#vx-screen)"/>
    <rect x="222" y="40" width="36" height="9" rx="4.5" fill="#0B0D10"/>
    <g fill="#FFFFFF" opacity="0.9">
      <rect x="198" y="80" width="54" height="10" rx="3"/><rect x="198" y="98" width="84" height="6" rx="3" opacity="0.6"/>
      <rect x="198" y="230" width="38" height="38" rx="10" opacity="0.35"/><rect x="244" y="230" width="38" height="38" rx="10" opacity="0.35"/>
    </g>
    <text x="198" y="160" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">10:24</text>
  </g>
  <!-- watch -->
  <g transform="translate(36 150)">
    <rect x="22" y="-40" width="56" height="44" rx="10" fill="#2A2F36"/>
    <rect x="22" y="96" width="56" height="44" rx="10" fill="#2A2F36"/>
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#0B0D10" stroke="#5B6270" stroke-width="2"/>
    <rect x="9" y="9" width="82" height="82" rx="19" fill="#111418"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#2A2F36" stroke-width="7"/>
    <path d="M50 20a30 30 0 0 1 28 40" fill="none" stroke="#C6FF3D" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 28a22 22 0 0 1 18 34" fill="none" stroke="#2563FF" stroke-width="5" stroke-linecap="round"/>
    <rect x="100" y="38" width="5" height="22" rx="2" fill="#5B6270"/>
  </g>
  <!-- earbuds case -->
  <g transform="translate(270 220)">
    <rect x="0" y="22" width="130" height="78" rx="34" fill="url(#vx-white)" stroke="#C3C9D1" stroke-width="1.5"/>
    <path d="M6 38c0-20 16-34 36-34h46c20 0 36 14 36 34z" fill="#EEF0F3" stroke="#C3C9D1" stroke-width="1.5" transform="translate(0 -30) rotate(-14 65 38)"/>
    <ellipse cx="44" cy="40" rx="18" ry="14" fill="#FFFFFF" stroke="#C3C9D1"/>
    <ellipse cx="86" cy="40" rx="18" ry="14" fill="#FFFFFF" stroke="#C3C9D1"/>
    <rect x="38" y="36" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#C3C9D1"/>
    <rect x="80" y="36" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#C3C9D1"/>
    <circle cx="65" cy="76" r="3" fill="#C6FF3D"/>
  </g>
</svg>
