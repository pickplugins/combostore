<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Over-ear wireless headphones">
  <!-- Spotlight art for templates/Voltix.js (sits on graphite, transparent background): over-ear wireless headphones with a volt accent and spec callout ticks. -->
  <defs>
    <linearGradient id="vx-hp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/><stop offset="1" stop-color="#B9C0CA"/>
    </linearGradient>
    <linearGradient id="vx-cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EBEF"/><stop offset="1" stop-color="#9AA3AF"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="210" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="200" cy="210" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="3 6"/>
  <!-- headband -->
  <path d="M86 230C86 110 140 60 200 60s114 50 114 170" fill="none" stroke="url(#vx-hp)" stroke-width="22" stroke-linecap="round"/>
  <path d="M104 200C108 118 150 84 200 84s92 34 96 116" fill="none" stroke="#2A2F36" stroke-width="10" stroke-linecap="round"/>
  <!-- left cup -->
  <rect x="52" y="200" width="88" height="128" rx="40" fill="url(#vx-cup)"/>
  <rect x="104" y="214" width="34" height="100" rx="17" fill="#2A2F36"/>
  <rect x="62" y="232" width="6" height="22" rx="3" fill="#C6FF3D"/>
  <!-- right cup -->
  <rect x="260" y="200" width="88" height="128" rx="40" fill="url(#vx-cup)"/>
  <rect x="262" y="214" width="34" height="100" rx="17" fill="#2A2F36"/>
  <circle cx="320" cy="300" r="4" fill="#2563FF"/>
  <!-- callouts -->
  <g stroke="#C6FF3D" stroke-width="1.5" fill="none">
    <path d="M68 244L30 200H6"/><path d="M330 300l36 40h28"/>
  </g>
  <g fill="#C6FF3D"><circle cx="68" cy="244" r="3"/><circle cx="330" cy="300" r="3"/></g>
  <g font-family="Courier New, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.7">
    <text x="6" y="194">ANC</text><text x="344" y="358">60H</text>
  </g>
</svg>
